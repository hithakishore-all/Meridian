<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner"><div class="wrap"><b>Synthetic demo</b><span>Every company, person, listing and figure is fictional. Agent answers come from cited demo facts.</span><span id="modeBadge" class="pill"></span></div></div>
<header class="top">
  <div class="wrap row">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 2v24M2 14h24" stroke="currentColor" stroke-width="1.2"/><circle cx="14" cy="14" r="3.5" fill="var(--meter)"/></svg>Meridian</div>
    <nav class="tabs" aria-label="Sections">
      <a href="#catalog" data-tab="catalog">Catalog</a>
      <a href="#workspace" data-tab="workspace">Buy and deploy</a>
      <a href="#run" data-tab="run">Run an agent</a>
      <a href="#approvals" data-tab="approvals">Approvals</a>
      <a href="#review" data-tab="review">Review queue</a>
      <a href="#health" data-tab="health">Health</a>
      <a href="#audit" data-tab="audit">Audit log</a>
    </nav>
    <button class="btn small" id="reset" title="Put the demo back to its starting state">Reset demo</button>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="app.js" type="module"></script>
</body>
</html>
